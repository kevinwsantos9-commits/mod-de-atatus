name: Build Minecraft Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar mod
        run: gradle --no-daemon clean build

      - name: Verificar arquivo JAR
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "Nenhum JAR foi gerado em build/libs/"
            exit 1
          fi
          printf 'JAR gerado: %s\\n' "${jars[@]}"

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: transformacao-mod-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
